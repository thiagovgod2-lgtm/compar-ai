<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ComparaAI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0d1117;
    color:white;
    height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    background:#161b22;
    border-bottom:1px solid #30363d;
    padding:20px;
    text-align:center;
}

header h1{
    color:#58a6ff;
}

header p{
    color:#8b949e;
    margin-top:5px;
}

#chat{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.msg{
    max-width:800px;
    margin:15px auto;
    padding:15px;
    border-radius:12px;
    white-space:pre-line;
}

.user{
    background:#238636;
}

.bot{
    background:#161b22;
    border:1px solid #30363d;
}

#input-area{
    background:#161b22;
    border-top:1px solid #30363d;
    padding:20px;
    display:flex;
}

#pergunta{
    flex:1;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#21262d;
    color:white;
    font-size:16px;
}

#pergunta:focus{
    outline:none;
}

#enviar{
    margin-left:10px;
    padding:15px 25px;
    border:none;
    border-radius:10px;
    background:#58a6ff;
    color:white;
    cursor:pointer;
    font-size:16px;
}

#enviar:hover{
    opacity:0.9;
}

</style>

</head>
<body>

<header>
    <h1>🛒 ComparaAI</h1>
    <p>Converse antes de comprar</p>
</header>

<div id="chat">

    <div class="msg bot">
🤖 Olá!

Sou o ComparaAI.

Posso ajudar você a encontrar:

• Celulares
• Notebooks
• TVs
• Fones de ouvido
• Consoles
• Qualquer produto

Digite o que deseja comprar.
    </div>

</div>

<div id="input-area">

    <input
        id="pergunta"
        type="text"
        placeholder="Ex: Quero um notebook até R$ 4.000"
    >

    <button id="enviar">
        Enviar
    </button>

</div>

<script>

async function enviarMensagem(){

    let input =
        document.getElementById("pergunta");

    let texto =
        input.value.trim();

    if(texto === "")
        return;

    let chat =
        document.getElementById("chat");

    chat.innerHTML += `
        <div class="msg user">
            👤 ${texto}
        </div>
    `;

    input.value = "";

    chat.innerHTML += `
        <div class="msg bot" id="loading">
            🤖 Analisando...
        </div>
    `;

    chat.scrollTop =
        chat.scrollHeight;

    try{

        let resposta =
            await fetch(
                "/chat?pergunta=" +
                encodeURIComponent(texto)
            );

        let dados =
            await resposta.json();

        document
            .getElementById("loading")
            .remove();

        chat.innerHTML += `
            <div class="msg bot">
                🤖 ${dados.resposta}
            </div>
        `;

    }catch{

        document
            .getElementById("loading")
            .remove();

        chat.innerHTML += `
            <div class="msg bot">
                ❌ Erro ao conectar ao servidor.
            </div>
        `;
    }

    chat.scrollTop =
        chat.scrollHeight;
}

document
.getElementById("enviar")
.addEventListener(
    "click",
    enviarMensagem
);

document
.getElementById("pergunta")
.addEventListener(
    "keypress",
    function(event){

        if(event.key === "Enter"){
            enviarMensagem();
        }

    }
);

</script>

</body>
</html>
